# Nginx config for the Lightsail server (Ubuntu, ap-south-1).
# Replace DOMAIN with the registered domain, e.g. randomcomputersolutions.in.
# HTTPS certificates are added afterwards with: sudo certbot --nginx -d DOMAIN -d www.DOMAIN -d app.DOMAIN

# Public website: static files from this repository.
server {
    listen 80;
    server_name DOMAIN www.DOMAIN;

    root /var/www/random-website;
    index index.html;

    # "Sign in" on the Trading App page goes to the app subdomain.
    location = /app { return 302 https://app.DOMAIN/; }

    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
}

# Random Trading App: FastAPI on 127.0.0.1:8000, never exposed directly.
server {
    listen 80;
    server_name app.DOMAIN;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
